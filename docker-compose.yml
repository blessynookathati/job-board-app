version: "3.8"

services:
  # MongoDB Database Container
  mongo:
    image: mongo:7.0
    container_name: jobconnect-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - jobconnect-net

  # Express + Node.js Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jobconnect-server
    restart: always
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/jobconnect
      - JWT_SECRET=jobconnect_production_secret_key_2026
      - NODE_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - jobconnect-net

  # React Frontend Container (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jobconnect-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - jobconnect-net

networks:
  jobconnect-net:
    driver: bridge

volumes:
  mongo-data: